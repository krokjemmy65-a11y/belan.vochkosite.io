<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВочТайм</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #edeef0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== ХЕДЕР ===== */
        .header {
            background: #4a76a8;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .logo span {
            color: #ffd700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header-right .user-name {
            font-weight: 500;
        }

        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .btn-primary {
            background: white;
            color: #4a76a8;
        }
        .btn-primary:hover {
            background: #e8f0fe;
            transform: scale(1.02);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }
        .btn-success:hover {
            background: #27ae60;
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.15);
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            flex: 1;
            width: 100%;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-box {
            background: white;
            border-radius: 12px;
            padding: 40px 35px;
            max-width: 420px;
            margin: 60px auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #d0d7dd;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #4a76a8;
            box-shadow: 0 0 0 3px rgba(74, 118, 168, 0.15);
        }

        .auth-box .btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 18px;
            color: #7f8c8d;
            cursor: pointer;
        }
        .auth-switch span {
            color: #4a76a8;
            font-weight: 600;
        }
        .auth-switch span:hover {
            text-decoration: underline;
        }

        .auth-error {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }

        /* ===== ТАБЫ (ВК СТИЛЬ) ===== */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .tab {
            flex: 1;
            padding: 14px 20px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #7f8c8d;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #f5f7fa;
        }

        .tab.active {
            color: #4a76a8;
            border-bottom-color: #4a76a8;
            background: #f8faff;
        }

        /* ===== СТЕНА (Лента ВК СТИЛЬ) ===== */
        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .feed-header h2 {
            color: #2c3e50;
        }

        .search-bar {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
            min-width: 200px;
        }

        .search-bar input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #d0d7dd;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.2s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #4a76a8;
            box-shadow: 0 0 0 3px rgba(74, 118, 168, 0.1);
        }

        /* ===== КАРТОЧКА ПОСТА (ВК СТИЛЬ) ===== */
        .post {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            transition: box-shadow 0.2s;
        }

        .post:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .post-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .post-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #4a76a8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-author-info .name {
            font-weight: 600;
            color: #2c3e50;
        }

        .post-author-info .date {
            font-size: 13px;
            color: #7f8c8d;
        }

        .post-delete {
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
            transition: color 0.2s;
        }
        .post-delete:hover {
            color: #e74c3c;
        }

        .post-text {
            font-size: 15px;
            line-height: 1.6;
            color: #1a1a1a;
            margin: 8px 0 12px 0;
            word-break: break-word;
        }

        .post-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin: 8px 0 12px 0;
            display: block;
        }

        .post-footer {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f2f5;
        }

        .post-footer button {
            background: none;
            border: none;
            color: #7f8c8d;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .post-footer button:hover {
            color: #4a76a8;
            background: #f0f4f9;
        }

        .post-footer .liked {
            color: #e74c3c;
        }
        .post-footer .liked:hover {
            color: #c0392b;
        }

        .empty-feed {
            text-align: center;
            color: #7f8c8d;
            padding: 50px 20px;
            background: white;
            border-radius: 12px;
        }

        .empty-feed .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        /* ===== КОНТАКТЫ (ВК СТИЛЬ) ===== */
        .contact-item {
            background: white;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            transition: box-shadow 0.2s;
            cursor: pointer;
        }

        .contact-item:hover {
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #4a76a8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .contact-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contact-info {
            flex: 1;
        }

        .contact-info .name {
            font-weight: 600;
            color: #2c3e50;
        }

        .contact-info .email {
            font-size: 13px;
            color: #7f8c8d;
        }

        .contact-message-btn {
            padding: 6px 16px;
            background: #4a76a8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .contact-message-btn:hover {
            background: #3a5f8a;
        }

        /* ===== МЕССЕНДЖЕР ===== */
        .messenger-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .messenger-header {
            padding: 15px 20px;
            background: #4a76a8;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #d0d7dd;
        }

        .messenger-header .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
        }

        .messenger-header .back-btn:hover {
            opacity: 0.8;
        }

        .messenger-header .contact-name {
            font-weight: 600;
            font-size: 16px;
        }

        .messenger-messages {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
            background: #f5f7fa;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            word-break: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.sent {
            align-self: flex-end;
            background: #4a76a8;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: white;
            color: #1a1a1a;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        .message .time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
        }

        .message.sent .time {
            text-align: right;
        }

        .messenger-input {
            padding: 12px 20px;
            border-top: 1px solid #d0d7dd;
            display: flex;
            gap: 10px;
            background: white;
        }

        .messenger-input input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #d0d7dd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .messenger-input input:focus {
            border-color: #4a76a8;
        }

        .messenger-input .btn {
            padding: 8px 20px;
            border-radius: 20px;
        }

        /* ===== TIKTOK СТИЛЬ ДЛЯ ВОЧТАЙМ ===== */
        .tiktok-feed {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .tiktok-video {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            background: #000;
            border-bottom: 1px solid #2a2a2a;
        }

        .tiktok-video video {
            width: 100%;
            max-height: 70vh;
            display: block;
            background: #000;
            cursor: pointer;
        }

        .tiktok-info {
            padding: 15px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            position: relative;
        }

        .tiktok-author {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .tiktok-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff0050, #00f2ea);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid #ff0050;
        }

        .tiktok-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tiktok-username {
            font-weight: 600;
            color: white;
            font-size: 16px;
        }

        .tiktok-username span {
            color: #888;
            font-weight: 400;
            font-size: 14px;
            margin-left: 5px;
        }

        .tiktok-description {
            color: white;
            font-size: 15px;
            line-height: 1.5;
            margin: 5px 0;
        }

        .tiktok-actions {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2a2a2a;
        }

        .tiktok-actions button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .tiktok-actions button:hover {
            color: white;
        }

        .tiktok-actions .liked {
            color: #ff0050;
        }

        .tiktok-actions .liked:hover {
            color: #ff0050;
        }

        /* ===== МОДАЛКИ ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            justify-content: center;
            align-items: center;
            z-index: 300;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: modalIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal h3 {
            margin-bottom: 18px;
            color: #2c3e50;
        }

        .modal input,
        .modal textarea {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #d0d7dd;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal input:focus,
        .modal textarea:focus {
            outline: none;
            border-color: #4a76a8;
            box-shadow: 0 0 0 3px rgba(74, 118, 168, 0.1);
        }

        .modal .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .modal .modal-buttons .btn {
            padding: 10px 24px;
        }

        .file-input-label {
            display: inline-block;
            padding: 8px 16px;
            background: #4a76a8;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .file-input-label:hover {
            background: #3a5f8a;
        }

        .file-input-label input {
            display: none;
        }

        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .avatar-upload .preview {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4a76a8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-upload .preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-dropdown {
            position: relative;
            display: inline-block;
        }

        .profile-dropdown .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: white;
            min-width: 200px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border-radius: 10px;
            padding: 10px 0;
            z-index: 200;
        }

        .profile-dropdown .dropdown-content.active {
            display: block;
        }

        .profile-dropdown .dropdown-content a {
            display: block;
            padding: 10px 20px;
            color: #2c3e50;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .profile-dropdown .dropdown-content a:hover {
            background: #f0f4f9;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2c3e50;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
            max-width: 320px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .header-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .header-avatar-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
        }

        .unread-badge {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 5px;
        }

        .create-post-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #4a76a8;
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(74, 118, 168, 0.3);
            transition: transform 0.2s;
            z-index: 40;
        }

        .create-post-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .header {
                flex-wrap: wrap;
                gap: 8px;
            }
            .logo {
                font-size: 20px;
            }
            .container {
                padding: 0 10px;
                margin-top: 12px;
            }
            .auth-box {
                padding: 25px 20px;
                margin: 30px 10px;
            }
            .post {
                padding: 15px;
            }
            .feed-header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-bar {
                max-width: 100%;
            }
            .tabs {
                flex-direction: row;
                overflow-x: auto;
            }
            .tab {
                padding: 10px 15px;
                font-size: 13px;
                white-space: nowrap;
            }
            .messenger-container {
                height: 400px;
            }
            .tiktok-video video {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>

    <header class="header" id="appHeader">
        <div class="logo" onclick="switchTab('posts')">Воч<span>Тайм</span></div>
        <div class="header-right" id="headerRight">
            <!-- Заполняется JS -->
        </div>
    </header>

    <div class="container" id="appContainer">
        <!-- Сюда рендерится либо форма входа, либо лента -->
    </div>

    <!-- ===== МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ ===== -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal">
            <h3>✏️ Редактировать профиль</h3>
            <div class="avatar-upload">
                <div class="preview" id="avatarPreview">👤</div>
                <label class="file-input-label">
                    📷 Загрузить аватар
                    <input type="file" accept="image/*" id="avatarInput" onchange="previewAvatar(event)">
                </label>
            </div>
            <input type="text" id="editName" placeholder="Имя">
            <input type="text" id="editSurname" placeholder="Фамилия">
            <input type="text" id="editCity" placeholder="Город">
            <div class="modal-buttons">
                <button class="btn btn-danger" onclick="closeProfileModal()">Отмена</button>
                <button class="btn btn-success" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- ===== ТОСТ ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 1. РАБОТА С LOCALSTORAGE
        // ============================================================

        const DB = {
            getUsers() {
                return JSON.parse(localStorage.getItem('vk_users')) || [];
            },
            setUsers(users) {
                localStorage.setItem('vk_users', JSON.stringify(users));
            },
            getPosts() {
                return JSON.parse(localStorage.getItem('vk_posts')) || [];
            },
            setPosts(posts) {
                localStorage.setItem('vk_posts', JSON.stringify(posts));
            },
            getMessages() {
                return JSON.parse(localStorage.getItem('vk_messages')) || [];
            },
            setMessages(messages) {
                localStorage.setItem('vk_messages', JSON.stringify(messages));
            },
            getCurrentUser() {
                const data = JSON.parse(localStorage.getItem('vk_current_user'));
                return data || null;
            },
            setCurrentUser(user) {
                if (user) {
                    localStorage.setItem('vk_current_user', JSON.stringify(user));
                } else {
                    localStorage.removeItem('vk_current_user');
                }
            }
        };

        // ============================================================
        // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================

        let currentTab = 'posts';
        let currentSearchQuery = '';
        let messengerContactId = null;

        function generateId() {
            return Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        }

        function formatDate(ts) {
            const d = new Date(ts);
            const now = new Date();
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
            if (diff < 172800) return 'вчера';
            return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        function getInitials(name, surname) {
            return (name?.[0] || '').toUpperCase() + (surname?.[0] || '').toUpperCase();
        }

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 2800);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 3. АВТОРИЗАЦИЯ / РЕГИСТРАЦИЯ
        // ============================================================

        function renderAuth() {
            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="auth-box">
                    <h2 id="authTitle">🔐 Вход</h2>
                    <div class="auth-error" id="authError">Неверные данные</div>
                    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
                    <input type="password" id="authPassword" placeholder="Пароль" autocomplete="current-password">
                    <button class="btn btn-primary" id="authSubmitBtn">Войти</button>
                    <div class="auth-switch" id="authSwitch">
                        Нет аккаунта? <span>Зарегистрироваться</span>
                    </div>
                </div>
            `;

            let isLogin = true;

            const title = document.getElementById('authTitle');
            const submitBtn = document.getElementById('authSubmitBtn');
            const switchEl = document.getElementById('authSwitch');
            const errorEl = document.getElementById('authError');

            function updateForm() {
                title.textContent = isLogin ? '🔐 Вход' : '📝 Регистрация';
                submitBtn.textContent = isLogin ? 'Войти' : 'Создать аккаунт';
                switchEl.innerHTML = isLogin
                    ? 'Нет аккаунта? <span>Зарегистрироваться</span>'
                    : 'Уже есть аккаунт? <span>Войти</span>';
                errorEl.style.display = 'none';
            }

            switchEl.addEventListener('click', () => {
                isLogin = !isLogin;
                updateForm();
            });

            submitBtn.addEventListener('click', () => {
                const email = document.getElementById('authEmail').value.trim();
                const password = document.getElementById('authPassword').value.trim();

                if (!email || !password) {
                    errorEl.textContent = 'Заполните все поля';
                    errorEl.style.display = 'block';
                    return;
                }

                const users = DB.getUsers();

                if (isLogin) {
                    const user = users.find(u => u.email === email && u.password === password);
                    if (!user) {
                        errorEl.textContent = 'Неверный email или пароль';
                        errorEl.style.display = 'block';
                        return;
                    }
                    DB.setCurrentUser({ id: user.id, email: user.email, name: user.name, surname: user.surname, city: user.city, avatar: user.avatar || null });
                    showToast('👋 Добро пожаловать, ' + user.name + '!');
                    renderApp();
                } else {
                    if (users.find(u => u.email === email)) {
                        errorEl.textContent = 'Этот email уже занят';
                        errorEl.style.display = 'block';
                        return;
                    }
                    const newUser = {
                        id: generateId(),
                        email,
                        password,
                        name: 'Пользователь',
                        surname: '',
                        city: '',
                        avatar: null
                    };
                    users.push(newUser);
                    DB.setUsers(users);
                    DB.setCurrentUser({ id: newUser.id, email: newUser.email, name: newUser.name, surname: newUser.surname, city: newUser.city, avatar: null });
                    showToast('✅ Аккаунт создан!');
                    renderApp();
                }
            });

            document.getElementById('authEmail').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitBtn.click();
            });
            document.getElementById('authPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitBtn.click();
            });

            updateHeader(null);
        }

        // ============================================================
        // 4. ОСНОВНОЙ ИНТЕРФЕЙС
        // ============================================================

        function renderApp() {
            const user = DB.getCurrentUser();
            if (!user) {
                renderAuth();
                return;
            }

            const users = DB.getUsers();
            const freshUser = users.find(u => u.id === user.id);
            if (freshUser) {
                DB.setCurrentUser({ id: freshUser.id, email: freshUser.email, name: freshUser.name, surname: freshUser.surname, city: freshUser.city, avatar: freshUser.avatar || null });
            }

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                <div class="tabs">
                    <div class="tab ${currentTab === 'posts' ? 'active' : ''}" onclick="switchTab('posts')">📰 Посты</div>
                    <div class="tab ${currentTab === 'video' ? 'active' : ''}" onclick="switchTab('video')">🎬 ВочТайм</div>
                    <div class="tab ${currentTab === 'contacts' ? 'active' : ''}" onclick="switchTab('contacts')">👥 Контакты</div>
                </div>

                <div id="tabContent"></div>
                
                <button class="create-post-btn" onclick="openCreatePost()">+</button>
            `;

            updateHeader(DB.getCurrentUser());
            renderTabContent();
        }

        function switchTab(tab) {
            currentTab = tab;
            messengerContactId = null;
            renderApp();
        }

        function renderTabContent() {
            const container = document.getElementById('tabContent');
            if (!container) return;

            if (messengerContactId) {
                renderMessenger(container);
            } else if (currentTab === 'posts') {
                renderPostsTab(container);
            } else if (currentTab === 'video') {
                renderVideoTab(container);
            } else if (currentTab === 'contacts') {
                renderContactsTab(container);
            }
        }

        // ============================================================
        // 5. ВКЛАДКА ПОСТЫ (ВК СТИЛЬ)
        // ============================================================

        function renderPostsTab(container) {
            container.innerHTML = `
                <div class="feed-header">
                    <h2>📰 Лента постов</h2>
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Поиск по постам..." oninput="searchPosts()">
                        <button class="btn btn-primary" onclick="searchPosts()">🔍</button>
                    </div>
                </div>
                <div id="feedPosts"></div>
            `;

            renderFeed();
        }

        function renderFeed() {
            const user = DB.getCurrentUser();
            if (!user) return;

            let posts = DB.getPosts();
            const users = DB.getUsers();

            // Только посты без видео
            posts = posts.filter(p => !p.video);

            if (currentSearchQuery.trim()) {
                const query = currentSearchQuery.trim().toLowerCase();
                posts = posts.filter(p => p.text.toLowerCase().includes(query));
            }

            const sorted = [...posts].sort((a, b) => b.createdAt - a.createdAt);

            const feedContainer = document.getElementById('feedPosts');
            if (!feedContainer) return;

            if (sorted.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-feed">
                        <span class="emoji">📭</span>
                        <p>${currentSearchQuery.trim() ? 'Ничего не найдено' : 'Здесь пока пусто'}</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const post of sorted) {
                const author = users.find(u => u.id === post.authorId);
                if (!author) continue;

                const isAuthor = author.id === user.id;
                const initials = getInitials(author.name, author.surname) || 'U';
                const displayName = author.name + (author.surname ? ' ' + author.surname : '');

                const avatarHtml = author.avatar
                    ? `<img src="${author.avatar}" alt="avatar">`
                    : initials;

                const likes = post.likes || [];
                const isLiked = likes.includes(user.id);
                const likeCount = likes.length;

                const imageHtml = post.image ? `<img src="${post.image}" class="post-image" alt="post image">` : '';

                html += `
                    <div class="post" data-id="${post.id}">
                        <div class="post-header">
                            <div class="post-author">
                                <div class="post-avatar">${avatarHtml}</div>
                                <div class="post-author-info">
                                    <div class="name">${displayName}</div>
                                    <div class="date">${formatDate(post.createdAt)}</div>
                                </div>
                            </div>
                            ${isAuthor ? `<button class="post-delete" onclick="deletePost('${post.id}')" title="Удалить">✕</button>` : ''}
                        </div>
                        <div class="post-text">${escapeHtml(post.text)}</div>
                        ${imageHtml}
                        <div class="post-footer">
                            <button onclick="toggleLike('${post.id}')" class="${isLiked ? 'liked' : ''}">
                                ❤️ ${likeCount > 0 ? likeCount : ''}
                            </button>
                            <button onclick="showToast('💬 Комментарии пока не реализованы')">💬 0</button>
                        </div>
                    </div>
                `;
            }

            feedContainer.innerHTML = html;
        }

        function searchPosts() {
            const input = document.getElementById('searchInput');
            currentSearchQuery = input ? input.value : '';
            renderFeed();
        }

        // ============================================================
        // 6. ВКЛАДКА ВОЧТАЙМ (TIKTOK СТИЛЬ)
        // ============================================================

        function renderVideoTab(container) {
            const user = DB.getCurrentUser();
            if (!user) return;

            let posts = DB.getPosts();
            const users = DB.getUsers();

            posts = posts.filter(p => p.video);

            const sorted = [...posts].sort((a, b) => b.createdAt - a.createdAt);

            container.innerHTML = `
                <div class="feed-header">
                    <h2 style="color:white;">🎬 ВочТайм</h2>
                </div>
                <div class="tiktok-feed" id="tiktokFeed"></div>
            `;

            const videoContainer = document.getElementById('tiktokFeed');
            if (!videoContainer) return;

            if (sorted.length === 0) {
                videoContainer.innerHTML = `
                    <div class="empty-feed" style="background:white;">
                        <span class="emoji">🎬</span>
                        <p>Видео пока нет</p>
                        <p style="font-size:14px;margin-top:10px;color:#7f8c8d;">Нажмите + чтобы загрузить первое видео</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const post of sorted) {
                const author = users.find(u => u.id === post.authorId);
                if (!author) continue;

                const initials = getInitials(author.name, author.surname) || 'U';
                const displayName = author.name + (author.surname ? ' ' + author.surname : '');

                const avatarHtml = author.avatar
                    ? `<img src="${author.avatar}" alt="avatar">`
                    : initials;

                const likes = post.likes || [];
                const isLiked = likes.includes(user.id);
                const likeCount = likes.length;

                html += `
                    <div class="tiktok-video" data-id="${post.id}">
                        <video src="${post.video}" loop playsinline preload="metadata"></video>
                        <div class="tiktok-info">
                            <div class="tiktok-author">
                                <div class="tiktok-avatar">${avatarHtml}</div>
                                <div class="tiktok-username">
                                    ${displayName} <span>• ${formatDate(post.createdAt)}</span>
                                </div>
                            </div>
                            ${post.text ? `<div class="tiktok-description">${escapeHtml(post.text)}</div>` : ''}
                            <div class="tiktok-actions">
                                <button onclick="toggleLike('${post.id}')" class="${isLiked ? 'liked' : ''}">
                                    ❤️ ${likeCount > 0 ? likeCount : ''}
                                </button>
                                <button onclick="showToast('💬 Комментарии пока не реализованы')">💬 0</button>
                                <button onclick="shareVideo('${post.id}')">🔗 Поделиться</button>
                                ${author.id === user.id ? `<button onclick="deletePost('${post.id}')" style="color:#e74c3c;">🗑️</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            videoContainer.innerHTML = html;

            // Автовоспроизведение
            const videos = videoContainer.querySelectorAll('video');
            videos.forEach(video => {
                video.addEventListener('click', () => {
                    if (video.paused) {
                        video.play();
                    } else {
                        video.pause();
                    }
                });

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            video.play();
                        } else {
                            video.pause();
                        }
                    });
                }, { threshold: 0.5 });

                observer.observe(video);
            });
        }

        function shareVideo(postId) {
            const url = window.location.href + '?video=' + postId;
            navigator.clipboard.writeText(url).then(() => {
                showToast('🔗 Ссылка на видео скопирована!');
            }).catch(() => {
                showToast('🔗 Ссылка: ' + url);
            });
        }

        // ============================================================
        // 7. ВКЛАДКА КОНТАКТЫ И МЕССЕНДЖЕР
        // ============================================================

        function renderContactsTab(container) {
            const user = DB.getCurrentUser();
            if (!user) return;

            const users = DB.getUsers();
            const contacts = users.filter(u => u.id !== user.id);

            let searchQuery = currentSearchQuery.trim().toLowerCase();

            let filtered = contacts;
            if (searchQuery) {
                filtered = contacts.filter(u => 
                    (u.name + ' ' + u.surname).toLowerCase().includes(searchQuery) ||
                    u.email.toLowerCase().includes(searchQuery)
                );
            }

            container.innerHTML = `
                <div class="feed-header">
                    <h2>👥 Контакты</h2>
                    <div class="search-bar">
                        <input type="text" id="contactSearchInput" placeholder="Поиск контактов..." oninput="searchContacts()">
                        <button class="btn btn-primary" onclick="searchContacts()">🔍</button>
                    </div>
                </div>
                <div id="contactsList"></div>
            `;

            const contactsContainer = document.getElementById('contactsList');
            if (!contactsContainer) return;

            if (filtered.length === 0) {
                contactsContainer.innerHTML = `
                    <div class="empty-feed">
                        <span class="emoji">👀</span>
                        <p>${searchQuery ? 'Ничего не найдено' : 'Пока нет других пользователей'}</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const contact of filtered) {
                const initials = getInitials(contact.name, contact.surname) || 'U';
                const displayName = contact.name + (contact.surname ? ' ' + contact.surname : '');

                const avatarHtml = contact.avatar
                    ? `<img src="${contact.avatar}" alt="avatar">`
                    : initials;

                // Проверяем непрочитанные сообщения
                const unreadCount = DB.getMessages().filter(m => m.from === contact.id && m.to === user.id && !m.read).length;

                html += `
                    <div class="contact-item" onclick="openMessenger('${contact.id}')">
                        <div class="contact-avatar">${avatarHtml}</div>
                        <div class="contact-info">
                            <div class="name">${displayName} ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}</div>
                            <div class="email">${contact.email}</div>
                        </div>
                        <button class="contact-message-btn" onclick="event.stopPropagation(); openMessenger('${contact.id}')">💬</button>
                    </div>
                `;
            }

            contactsContainer.innerHTML = html;
        }

        function searchContacts() {
            const input = document.getElementById('contactSearchInput');
            currentSearchQuery = input ? input.value : '';
            renderContactsTab(document.getElementById('tabContent'));
        }

        // ============================================================
        // 8. МЕССЕНДЖЕР
        // ============================================================

        function openMessenger(contactId) {
            messengerContactId = contactId;
            renderApp();
        }

        function renderMessenger(container) {
            const user = DB.getCurrentUser();
            if (!user) return;

            const users = DB.getUsers();
            const contact = users.find(u => u.id === messengerContactId);
            if (!contact) {
                messengerContactId = null;
                renderApp();
                return;
            }

            const displayName = contact.name + (contact.surname ? ' ' + contact.surname : '');
            const messages = DB.getMessages().filter(m => 
                (m.from === user.id && m.to === contact.id) || 
                (m.from === contact.id && m.to === user.id)
            );

            // Помечаем сообщения как прочитанные
            const updatedMessages = DB.getMessages().map(m => {
                if (m.from === contact.id && m.to === user.id && !m.read) {
                    return { ...m, read: true };
                }
                return m;
            });
            DB.setMessages(updatedMessages);

            container.innerHTML = `
                <div class="messenger-container">
                    <div class="messenger-header">
                        <button class="back-btn" onclick="messengerContactId = null; renderApp();">←</button>
                        <div class="contact-name">${displayName}</div>
                    </div>
                    <div class="messenger-messages" id="messengerMessages"></div>
                    <div class="messenger-input">
                        <input type="text" id="messageInput" placeholder="Введите сообщение..." onkeydown="if(event.key==='Enter') sendMessageToContact()">
                        <button class="btn btn-primary" onclick="sendMessageToContact()">Отправить</button>
                    </div>
                </div>
            `;

            const messagesContainer = document.getElementById('messengerMessages');
            if (!messagesContainer) return;

            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div style="text-align:center;color:#7f8c8d;padding:40px 0;">
                        <p>Нет сообщений</p>
                        <p style="font-size:13px;margin-top:5px;">Напишите что-нибудь</p>
                    </div>
                `;
                return;
            }

            let html = '';
            const sortedMessages = [...messages].sort((a, b) => a.createdAt - b.createdAt);

            for (const msg of sortedMessages) {
                const isSent = msg.from === user.id;
                html += `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        ${escapeHtml(msg.text)}
                        <span class="time">${formatTime(msg.createdAt)}</span>
                    </div>
                `;
            }

            messagesContainer.innerHTML = html;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessageToContact() {
            const input = document.getElementById('messageInput');
            if (!input) return;

            const text = input.value.trim();
            if (!text) return;

            const user = DB.getCurrentUser();
            if (!user || !messengerContactId) return;

            const messages = DB.getMessages();
            messages.push({
                id: generateId(),
                from: user.id,
                to: messengerContactId,
                text: text,
                createdAt: Date.now(),
                read: false
            });
            DB.setMessages(messages);

            input.value = '';
            renderMessenger(document.getElementById('tabContent'));
        }

        // ============================================================
        // 9. ДЕЙСТВИЯ С ПОСТАМИ
        // ============================================================

        let tempPostMedia = null;
        let tempMediaType = null;

        function openCreatePost() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay active';
            modal.id = 'createPostModal';
            modal.innerHTML = `
                <div class="modal">
                    <h3>📝 Новый пост</h3>
                    <textarea id="postText" placeholder="Что у вас нового?" style="width:100%;padding:12px;border:1px solid #d0d7dd;border-radius:8px;resize:vertical;min-height:80px;font-size:15px;"></textarea>
                    <div style="margin:12px 0;display:flex;gap:10px;flex-wrap:wrap;">
                        <label class="file-input-label">
                            📷 Фото
                            <input type="file" accept="image/*" id="postImageInput" onchange="previewPostMedia(event, 'image')">
                        </label>
                        <label class="file-input-label">
                            🎬 Видео
                            <input type="file" accept="video/*" id="postVideoInput" onchange="previewPostMedia(event, 'video')">
                        </label>
                    </div>
                    <div id="postMediaPreview" style="margin-top:10px;"></div>
                    <div class="modal-buttons">
                        <button class="btn btn-danger" onclick="closeCreatePost()">Отмена</button>
                        <button class="btn btn-success" onclick="publishPost()">Опубликовать</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeCreatePost();
            });

            setTimeout(() => document.getElementById('postText').focus(), 100);
        }

        function previewPostMedia(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                tempPostMedia = e.target.result;
                tempMediaType = type;
                const preview = document.getElementById('postMediaPreview');
                if (type === 'image') {
                    preview.innerHTML = `<img src="${tempPostMedia}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid #ddd;">`;
                } else {
                    preview.innerHTML = `<video src="${tempPostMedia}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid #ddd;" controls></video>`;
                }
            };
            reader.readAsDataURL(file);
        }

        function closeCreatePost() {
            const modal = document.getElementById('createPostModal');
            if (modal) modal.remove();
            tempPostMedia = null;
            tempMediaType = null;
        }

        function publishPost() {
            const text = document.getElementById('postText').value.trim();
            if (!text && !tempPostMedia) {
                showToast('❌ Напишите текст или добавьте медиа');
                return;
            }

            const user = DB.getCurrentUser();
            if (!user) return;

            const posts = DB.getPosts();
            const newPost = {
                id: generateId(),
                text: text || '',
                authorId: user.id,
                createdAt: Date.now(),
                likes: []
            };

            if (tempPostMedia && tempMediaType === 'image') {
                newPost.image = tempPostMedia;
            } else if (tempPostMedia && tempMediaType === 'video') {
                newPost.video = tempPostMedia;
            }

            posts.push(newPost);
            DB.setPosts(posts);
            showToast('✅ Пост опубликован!');
            closeCreatePost();
            renderApp();
        }

        function deletePost(postId) {
            if (!confirm('Удалить этот пост?')) return;
            let posts = DB.getPosts();
            posts = posts.filter(p => p.id !== postId);
            DB.setPosts(posts);
            showToast('🗑️ Пост удалён');
            renderApp();
        }

        function toggleLike(postId) {
            const user = DB.getCurrentUser();
            if (!user) return;

            let posts = DB.getPosts();
            const post = posts.find(p => p.id === postId);
            if (!post) return;

            if (!post.likes) post.likes = [];

            const idx = post.likes.indexOf(user.id);
            if (idx !== -1) {
                post.likes.splice(idx, 1);
            } else {
                post.likes.push(user.id);
            }

            DB.setPosts(posts);
            renderApp();
        }

        // ============================================================
        // 10. ПРОФИЛЬ И ХЕДЕР
        // ============================================================

        function updateHeader(user) {
            const right = document.getElementById('headerRight');
            if (!user) {
                right.innerHTML = `<button class="btn btn-primary" onclick="renderAuth()">Войти</button>`;
                return;
            }

            const users = DB.getUsers();
            const fresh = users.find(u => u.id === user.id);
            const name = fresh ? fresh.name : user.name;
            const surname = fresh ? fresh.surname : user.surname;
            const displayName = name + (surname ? ' ' + surname : '');

            const avatarHtml = fresh?.avatar
                ? `<img src="${fresh.avatar}" class="header-avatar" alt="avatar">`
                : `<div class="header-avatar-placeholder">${getInitials(name, surname) || 'U'}</div>`;

            const unreadCount = DB.getMessages().filter(m => m.to === user.id && !m.read).length;

            right.innerHTML = `
                ${avatarHtml}
                <span class="user-name">${displayName}</span>
                <div class="profile-dropdown">
                    <button class="btn btn-outline" onclick="toggleDropdown()">▼</button>
                    <div class="dropdown-content" id="dropdownMenu">
                        <a onclick="openProfileModal()">👤 Редактировать профиль</a>
                        <a onclick="showToast('📨 У вас ${unreadCount} новых сообщений')">💬 Сообщения ${unreadCount > 0 ? '🔴' : ''}</a>
                        <a onclick="logout()">🚪 Выйти</a>
                    </div>
                </div>
            `;
        }

        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdownMenu');
            if (menu && !e.target.closest('.profile-dropdown')) {
                menu.classList.remove('active');
            }
        });

        function logout() {
            if (!confirm('Выйти из аккаунта?')) return;
            DB.setCurrentUser(null);
            showToast('👋 До свидания!');
            renderAuth();
        }

        // ============================================================
        // 11. МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ
        // ============================================================

        let tempAvatar = null;

        function openProfileModal() {
            const user = DB.getCurrentUser();
            if (!user) return;

            const users = DB.getUsers();
            const fresh = users.find(u => u.id === user.id);
            if (!fresh) return;

            document.getElementById('editName').value = fresh.name || '';
            document.getElementById('editSurname').value = fresh.surname || '';
            document.getElementById('editCity').value = fresh.city || '';

            const preview = document.getElementById('avatarPreview');
            if (fresh.avatar) {
                preview.innerHTML = `<img src="${fresh.avatar}" alt="avatar">`;
            } else {
                preview.textContent = getInitials(fresh.name, fresh.surname) || '👤';
                preview.style.background = '#4a76a8';
                preview.style.color = 'white';
            }
            tempAvatar = null;
            document.getElementById('profileModal').classList.add('active');
        }

        function closeProfileModal() {
            document.getElementById('profileModal').classList.remove('active');
            tempAvatar = null;
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                tempAvatar = e.target.result;
                const preview = document.getElementById('avatarPreview');
                preview.innerHTML = `<img src="${tempAvatar}" alt="avatar">`;
            };
            reader.readAsDataURL(file);
        }

        function saveProfile() {
            const user = DB.getCurrentUser();
            if (!user) return;

            const name = document.getElementById('editName').value.trim() || 'Пользователь';
            const surname = document.getElementById('editSurname').value.trim();
            const city = document.getElementById('editCity').value.trim();

            let users = DB.getUsers();
            const idx = users.findIndex(u => u.id === user.id);
            if (idx === -1) return;

            users[idx].name = name;
            users[idx].surname = surname;
            users[idx].city = city;
            if (tempAvatar) {
                users[idx].avatar = tempAvatar;
            }

            DB.setUsers(users);

            DB.setCurrentUser({ id: users[idx].id, email: users[idx].email, name, surname, city, avatar: users[idx].avatar || null });
            closeProfileModal();
            showToast('✅ Профиль обновлён!');
            renderApp();
        }

        // ============================================================
        // 12. ЗАПУСК
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            const user = DB.getCurrentUser();
            if (user) {
                const users = DB.getUsers();
                const exists = users.find(u => u.id === user.id);
                if (exists) {
                    renderApp();
                    return;
                }
            }
            renderAuth();
        });

        document.getElementById('profileModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeProfileModal();
        });

        console.log('📱 ВочТайм загружен!');
        console.log('👤 Данные хранятся в localStorage');
    </script>
</body>
</html>
